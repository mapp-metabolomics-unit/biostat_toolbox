npc_summed_intensity:
  # Plot summed raw intensity for features matching selected CANOPUS NPC terms.
  # Leave pathway, superclass, and class empty to skip this plot.
  # Example:
  # superclass:
  #   - "Carotenoids (C40)"
  # class:
  #   - "Triacylglycerols"
  #   - "Diacylglycerols"
  pathway: []
  superclass: []
  class: []
  expand_all: FALSE # TRUE plots every observed NPC class/superclass listed in expand_levels
  expand_pathway: [] # e.g. "Fatty acids"; use this to plot every present class/superclass under a pathway
  expand_levels:
    - "class" # "class", "superclass", or both
  min_probability: 0 # minimum CANOPUS NPC probability for the selected level; e.g. class uses NPC#class Probability
  transform: "log10" # "log10" or "none"
  static_export_top_n: 40 # combined PDF/PNG exports keep the top N terms; TSV exports keep all terms
  raw_export: TRUE
  ratios:
    enabled: TRUE
    denominator_level: "pathway"
    pseudocount: 0


