seed: 1
# Optional human-readable label for completed-job history (excluded from scientific hash):
# presentation: {description: "WT versus treatment across biological samples"}
preprocessing:
  blank_filter: {enabled: true, minimum_sample_to_blank_ratio: 5, minimum_blank_prevalence: 0.5}
  qc_rsd_filter: {enabled: true, threshold_percent: 30}
  missing_values: {method: half_minimum}
  normalization: {method: pqn}
  transformation: {method: log2}
  scaling: {method: pareto}
# Optional: map source groups without editing the shared dataset or input metadata:
# sample_plan:
#   group_column: ATTRIBUTE_group
#   groups:
#     - {source: control_A, target: control}
#     - {source: control_B, target: control}
#     - {source: treatment_A, target: treatment}
#     - {source: treatment_B, target: treatment}
# If sample_plan is enabled, set design.group to analysis_group.
design:
  group: ATTRIBUTE_group
  # block: ATTRIBUTE_block
  # Omit contrasts to run all unordered group pairs by default.
  # contrasts: all
  # To override with selected directed comparisons instead:
  # contrasts:
  #   - {name: treatment_vs_control, numerator: treatment, denominator: control}
analyses:
  pca: {enabled: true, components: 5}
  pcoa: {enabled: true, stage: normalized, distance: bray, components: 5}
  omnibus: {enabled: true}
  differential: {enabled: true}

